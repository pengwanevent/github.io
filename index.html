
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#FBE4EA">
  <title>在職QRcode</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 14px;
      background: #FBEFF2;
      color: #443843;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    .card {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px;
      background: #FFFFFF;
      border: 1px solid #F3DDE5;
      border-radius: 16px;
      box-shadow: 0 3px 16px rgba(110, 76, 100, .08);
    }

    h2 {
      margin-top: 0;
      font-size: 23px;
      text-align: center;
      color: #79566F;
    }

    .section-title {
      margin-top: 10px;
      margin-bottom: 12px;
      font-size: 20px;
      text-align: center;
      color: #79566F;
    }

    .muted {
      color: #786C78;
      font-size: 14px;
      line-height: 1.7;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      font-weight: bold;
      color: #594B59;
    }

    input {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid #E6D8E8;
      border-radius: 8px;
      background: #FFFFFF;
      color: #443843;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #DCC8EF;
      border-color: #B99ACF;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: 1px solid #F0D0B5;
      border-radius: 9px;
      background: #FCE8D5;
      color: #68452F;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #F8DCC0;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .secondary {
      background: #EDE4F8;
      border-color: #DCCBED;
      color: #604B78;
    }

    .secondary:hover {
      background: #E1D3F2;
    }

    .message {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid #F2DDE4;
      border-radius: 8px;
      background: #FBEFF2;
      color: #594653;
      line-height: 1.7;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .qr {
      display: block;
      width: 280px;
      max-width: 100%;
      height: auto;
      margin: 18px auto;
    }

    .field {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid #F0E7EF;
    }

    .field span:first-child {
      flex-shrink: 0;
      color: #786C78;
    }

    .field strong {
      text-align: right;
      overflow-wrap: anywhere;
      color: #443843;
    }

    .hidden {
      display: none !important;
    }

    .success {
      color: #72518A;
    }

    .warning {
      color: #A33B50;
    }

    .event-name {
      margin-top: -8px;
      margin-bottom: 18px;
      color: #786C78;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>

<body>
<main class="card">
  <h2 id="pageTitle">在職QRCode</h2>
  <div id="eventName" class="event-name"></div>

  <div id="message" class="message" role="status" aria-live="polite">
    系統初始化中……
  </div>

  <section id="apiTestSection" class="hidden">
    <h3 class="section-title">後端連線測試</h3>
    <p class="muted">
      這個測試不會讀取或修改任何場次資料，也不會產生 QR Code。
    </p>
    <button type="button" onclick="testBackendConnection_()">
      測試 Apps Script 後端連線
    </button>
  </section>

  <section id="eventPickerSection" class="hidden">
    <h3 class="section-title">請選擇在職場次</h3>
    <p class="muted">
      請選擇您報名的場次，再輸入填寫 SurveyCake 問卷時使用的手機號碼。
    </p>
    <button type="button" onclick="chooseEventForBinding_('1115')">
      11/15 場次
    </button>
    <button type="button" onclick="chooseEventForBinding_('1121')">
      11/21 場次
    </button>
    <button type="button" onclick="chooseEventForBinding_('1122')">
      11/22 場次
    </button>
  </section>

  <section id="bindSection" class="hidden">
    <p class="muted">
      請輸入填寫 SurveyCake 問卷時使用的手機號碼。系統會核對目前選定場次的資料。
    </p>

    <label for="phone">手機號碼</label>
    <input
      id="phone"
      type="tel"
      inputmode="tel"
      autocomplete="tel"
      maxlength="30"
      placeholder="例如：0912345678"
    >

    <button id="bindButton" type="button" onclick="submitBinding()">
      核對資料並綁定 LINE
    </button>

    <button
      class="secondary"
      type="button"
      onclick="returnToEventPicker_()"
    >
      返回選擇場次
    </button>
  </section>

  <section id="participantSection" class="hidden">
    <div id="participantInfo"></div>

    <img
      id="participantQr"
      class="qr hidden"
      alt="個人報到 QR Code"
    >

    <p id="qrHint" class="muted" style="text-align:center">
      QR Code 尚未載入。
    </p>

    <p class="muted" style="text-align:center">
      在職當天請向工作人員出示此 QR Code。
    </p>

    <button class="secondary" type="button" onclick="loadMyQr()">
      重新整理我的報到資料
    </button>

    <button
      class="secondary"
      type="button"
      onclick="returnToEventPicker_()"
    >
      查看其他場次
    </button>
  </section>

  <section id="staffSection" class="hidden">
    <p class="muted">
      請輸入工作人員 PIN，查詢參加者資料。核對姓名及場次後，再確認報到。
    </p>

    <label for="staffPin">工作人員 PIN</label>
    <input
      id="staffPin"
      type="password"
      autocomplete="off"
      placeholder="請輸入工作人員 PIN"
    >

    <button
      id="lookupButton"
      type="button"
      onclick="lookupStaffParticipant()"
    >
      驗證 PIN 並查詢資料
    </button>

    <div id="staffInfo"></div>

    <div id="checkInControls" class="hidden">
      <label for="device">報到設備名稱</label>
      <input id="device" type="text" maxlength="50" value="報到手機1">

      <button
        id="checkInButton"
        type="button"
        onclick="confirmCheckIn()"
      >
        確認報到
      </button>
    </div>
  </section>
</main>

<script>
"use strict";

/* 正式設定：保持正式 LIFF ID 與原 Apps Script 後端 */
const LIFF_ID = "2011929218-IOeMzt9Z";

const GAS_API_URL =
  "https://script.google.com/macros/s/AKfycbyPPjPvjmdblS0njmuUYXXcLMhxyeCEOUpBBh5p9TaAQILyi2czWrgW1I8B_xZfCkhZMA/exec";

const EVENT_NAME_BY_CODE = {
  "1115": "11/15在職場次",
  "1121": "11/21在職場次",
  "1122": "11/22在職場次"
};

const initialParams = new URLSearchParams(window.location.search);
const INITIAL_MODE = String(initialParams.get("mode") || "").trim();
const INITIAL_CODE = String(initialParams.get("code") || "").trim();
const REQUEST_TIMEOUT_MS = 25000;

let activeEventCode = String(initialParams.get("event") || "").trim();
let liffReady = false;
let currentCode = INITIAL_CODE;
let currentParticipant = null;
let lookupDone = false;

const pendingRequests = new Map();
const $ = id => document.getElementById(id);

function showMessage(text, type) {
  const element = $("message");
  element.textContent = text || "";
  element.className = "message" + (type ? " " + type : "");
}

function showSection(id) {
  [
    "apiTestSection",
    "eventPickerSection",
    "bindSection",
    "participantSection",
    "staffSection"
  ].forEach(sectionId => {
    const section = $(sectionId);
    if (section) section.classList.add("hidden");
  });

  if (id && $(id)) {
    $(id).classList.remove("hidden");
  }
}

function setButtonBusy(buttonId, busy, busyText) {
  const button = $(buttonId);
  if (!button) return;

  if (!button.dataset.originalText) {
    button.dataset.originalText = button.textContent.trim();
  }

  button.disabled = Boolean(busy);
  button.textContent = busy ? busyText : button.dataset.originalText;
}

function setEventHeading(eventCode) {
  $("eventName").textContent = EVENT_NAME_BY_CODE[eventCode] || "";
}

function addField(container, label, value) {
  const row = document.createElement("div");
  row.className = "field";

  const left = document.createElement("span");
  left.textContent = label;

  const right = document.createElement("strong");
  right.textContent = value || "未提供";

  row.append(left, right);
  container.appendChild(row);
}

/*
 * GitHub Pages 沒有 google.script.run。
 * 透過隱藏 iframe + POST 呼叫 ApiBridge.gs，
 * 再使用 postMessage 收回後端結果。
 */
window.addEventListener("message", function(event) {
  const data = event.data;

  if (
    !data ||
    data.channel !== "pengwanevent-gas-bridge" ||
    !data.requestId
  ) {
    return;
  }

  const pending = pendingRequests.get(String(data.requestId));
  if (!pending) return;

  let originAllowed = event.origin === "null";

  try {
    const host = new URL(event.origin).hostname;

    originAllowed = originAllowed ||
      host === "script.google.com" ||
      host === "googleusercontent.com" ||
      host.endsWith(".googleusercontent.com");

  } catch (err) {
    // 某些沙盒 iframe 會使用 opaque origin。
  }

  if (!originAllowed) return;

  clearTimeout(pending.timer);
  pendingRequests.delete(String(data.requestId));

  if (pending.iframe && pending.iframe.parentNode) {
    pending.iframe.parentNode.removeChild(pending.iframe);
  }

  if (pending.form && pending.form.parentNode) {
    pending.form.parentNode.removeChild(pending.form);
  }

  if (data.ok) {
    pending.resolve(data.data);
  } else {
    pending.reject(
      new Error(data.error || "Apps Script 後端發生錯誤。")
    );
  }
});

function gasPost_(method, args) {
  return new Promise(function(resolve, reject) {
    const requestId =
      "req_" + Date.now().toString(36) + "_" +
      Math.random().toString(36).slice(2, 12);

    const frameName = "gas_frame_" + requestId;

    const iframe = document.createElement("iframe");
    iframe.name = frameName;
    iframe.title = "背景 API 連線";
    iframe.setAttribute("aria-hidden", "true");
    iframe.style.cssText =
      "position:fixed;left:-10000px;top:-10000px;" +
      "width:1px;height:1px;border:0";

    const form = document.createElement("form");
    form.method = "POST";
    form.action = GAS_API_URL;
    form.target = frameName;
    form.style.display = "none";

    const payloadInput = document.createElement("input");
    payloadInput.type = "hidden";
    payloadInput.name = "payload";
    payloadInput.value = JSON.stringify({
      method: method,
      args: args || []
    });

    const requestInput = document.createElement("input");
    requestInput.type = "hidden";
    requestInput.name = "requestId";
    requestInput.value = requestId;

    form.append(payloadInput, requestInput);

    const timer = setTimeout(function() {
      pendingRequests.delete(requestId);

      if (iframe.parentNode) {
        iframe.parentNode.removeChild(iframe);
      }

      if (form.parentNode) {
        form.parentNode.removeChild(form);
      }

      reject(
        new Error(
          "連線逾時：Apps Script 後端沒有回覆。" +
          "請確認已新增 ApiBridge.gs 並部署最新版本。"
        )
      );
    }, REQUEST_TIMEOUT_MS);

    pendingRequests.set(requestId, {
      resolve: resolve,
      reject: reject,
      timer: timer,
      iframe: iframe,
      form: form
    });

    document.body.append(iframe, form);

    try {
      form.submit();
    } catch (error) {
      clearTimeout(timer);
      pendingRequests.delete(requestId);

      if (iframe.parentNode) {
        iframe.parentNode.removeChild(iframe);
      }

      if (form.parentNode) {
        form.parentNode.removeChild(form);
      }

      reject(error);
    }
  });
}

function callServer(method, args, onSuccess, onFailure) {
  gasPost_(method, args)
    .then(function(result) {
      if (typeof onSuccess === "function") {
        onSuccess(result);
      }
    })
    .catch(function(error) {
      showMessage(
        error && error.message
          ? error.message
          : "無法連線至後端程式。",
        "warning"
      );

      if (typeof onFailure === "function") {
        onFailure(error);
      }
    });
}

function readParamsAfterLiffInit_() {
  const params = new URLSearchParams(window.location.search);

  let eventCode = params.get("event") || "";
  let mode = params.get("mode") || INITIAL_MODE;
  let code = params.get("code") || INITIAL_CODE;

  const state = params.get("liff.state") || "";

  if (state) {
    try {
      const stateUrl = new URL(state, window.location.origin);

      eventCode =
        eventCode || stateUrl.searchParams.get("event") || "";

      mode =
        mode || stateUrl.searchParams.get("mode") || "";

      code =
        code || stateUrl.searchParams.get("code") || "";

    } catch (err) {
      const stateParams = new URLSearchParams(
        state.replace(/^\?/, "")
      );

      eventCode = eventCode || stateParams.get("event") || "";
      mode = mode || stateParams.get("mode") || "";
      code = code || stateParams.get("code") || "";
    }
  }

  return {
    eventCode: String(eventCode).trim(),
    mode: String(mode).trim(),
    code: String(code).trim()
  };
}

function updateUrlAfterInit_(params) {
  // 僅在 liff.init() 完成後呼叫，避免破壞 LIFF 初始化參數。
  const url = new URL(window.location.href);

  [
    "liff.state",
    "liff.referrer",
    "lineAppVersion"
  ].forEach(function(key) {
    url.searchParams.delete(key);
  });

  Object.keys(params || {}).forEach(function(key) {
    if (params[key]) {
      url.searchParams.set(key, params[key]);
    } else {
      url.searchParams.delete(key);
    }
  });

  window.history.replaceState({}, document.title, url.toString());
  return url;
}

function chooseEventForBinding_(eventCode) {
  const code = String(eventCode || "").trim();

  if (!Object.prototype.hasOwnProperty.call(EVENT_NAME_BY_CODE, code)) {
    showSection("eventPickerSection");
    showMessage("在職場次無效，請重新選擇。", "warning");
    return;
  }

  activeEventCode = code;
  setEventHeading(code);
  $("pageTitle").textContent = "在職QRCode";

  if (!liffReady) {
    showSection("eventPickerSection");
    showMessage("LINE 尚未完成初始化，請稍後再試。", "warning");
    return;
  }

  const targetUrl = new URL(window.location.href);

  [
    "liff.state",
    "liff.referrer",
    "lineAppVersion"
  ].forEach(function(key) {
    targetUrl.searchParams.delete(key);
  });

  targetUrl.searchParams.set("event", code);
  targetUrl.searchParams.delete("mode");
  targetUrl.searchParams.delete("code");

  if (!liff.isLoggedIn()) {
    showSection("eventPickerSection");
    showMessage("正在前往 LINE 登入……", "warning");

    liff.login({
      redirectUri: targetUrl.toString()
    });

    return;
  }

  window.history.replaceState({}, document.title, targetUrl.toString());
  loadMyQr();
}

function routeParticipantByEvent_() {
  const state = readParamsAfterLiffInit_();

  if (state.mode === "staff") {
    currentCode = state.code;
    activeEventCode = state.eventCode;

    if (
      !Object.prototype.hasOwnProperty.call(
        EVENT_NAME_BY_CODE,
        activeEventCode
      ) ||
      !currentCode
    ) {
      showMessage(
        "工作人員報到網址缺少有效場次或識別碼，" +
        "請重新掃描正確的報到 QR Code。",
        "warning"
      );
      return;
    }

    showSection("staffSection");
    $("pageTitle").textContent = "工作人員報到";
    setEventHeading(activeEventCode);
    showMessage("請輸入工作人員 PIN，開始查詢。");
    return;
  }

  if (
    state.eventCode &&
    Object.prototype.hasOwnProperty.call(
      EVENT_NAME_BY_CODE,
      state.eventCode
    )
  ) {
    activeEventCode = state.eventCode;

    if (!liff.isLoggedIn()) {
      chooseEventForBinding_(state.eventCode);
      return;
    }

    setEventHeading(state.eventCode);
    loadMyQr();
    return;
  }

  if (state.eventCode) {
    activeEventCode = "";
    showSection("eventPickerSection");
    showMessage("在職場次代碼無效，請重新選擇場次。", "warning");
    return;
  }

  activeEventCode = "";
  showSection("eventPickerSection");
  $("pageTitle").textContent = "在職QRcode";
  $("eventName").textContent = "";
  showMessage("請先選擇您報名的場次。");
}

function returnToEventPicker_() {
  activeEventCode = "";
  currentParticipant = null;
  currentCode = "";
  lookupDone = false;

  $("phone").value = "";
  $("participantInfo").replaceChildren();
  $("staffInfo").replaceChildren();

  $("participantQr").removeAttribute("src");
  $("participantQr").classList.add("hidden");
  $("qrHint").textContent = "QR Code 尚未載入。";
  $("checkInControls").classList.add("hidden");

  if (liffReady) {
    updateUrlAfterInit_({
      event: "",
      mode: "",
      code: ""
    });
  }

  showSection("eventPickerSection");
  $("pageTitle").textContent = "在職QRCode";
  $("eventName").textContent = "";
  showMessage("請選擇您報名的在職場次。");
}

function isAlreadyCheckedIn_(value) {
  const normalized = String(value || "")
    .trim()
    .replace(/[\s\u3000]/g, "");

  return ["已報到", "已完成報到", "報到完成"].indexOf(normalized) >= 0;
}

function renderParticipant(participant) {
  if (!participant) {
    showMessage("後端沒有回傳參加者資料。", "warning");
    return;
  }

  currentParticipant = participant;

  const participantEventCode =
    participant.eventCode || activeEventCode;

  if (
    Object.prototype.hasOwnProperty.call(
      EVENT_NAME_BY_CODE,
      participantEventCode
    )
  ) {
    activeEventCode = participantEventCode;
    setEventHeading(participantEventCode);
  }

  const container = $("participantInfo");
  container.replaceChildren();

addField(
  container,
  "場次",
  EVENT_NAME_BY_CODE[participant.eventCode || activeEventCode] ||
    participant.eventName ||
    participant.eventCode ||
    activeEventCode
);

  addField(container, "姓名", participant.name);
  addField(container, "期別學號", participant.studentId);
  addField(
    container,
    "報到狀態",
    participant.status || "尚未報到"
  );

  const qr = $("participantQr");
  const hint = $("qrHint");
  const qrUrl = String(participant.qrUrl || "").trim();

  qr.onerror = function() {
    qr.classList.add("hidden");
    qr.removeAttribute("src");
    hint.textContent =
      "QR Code 圖片載入失敗，請檢查網路或稍後重試。";
    hint.classList.remove("hidden");
  };

  if (/^https?:\/\//i.test(qrUrl)) {
    qr.src =
      "https://quickchart.io/qr?size=300&margin=2&text=" +
      encodeURIComponent(qrUrl);

    qr.classList.remove("hidden");
    hint.textContent =
      "請保存此 QR Code，在職當天向工作人員出示。";
    hint.classList.remove("hidden");

  } else {
    qr.removeAttribute("src");
    qr.classList.add("hidden");
    hint.textContent =
      "目前尚無有效報到網址，請聯絡主辦單位。";
    hint.classList.remove("hidden");
  }

  showSection("participantSection");
  $("pageTitle").textContent = "我的報到 QR Code";

  showMessage(
    isAlreadyCheckedIn_(participant.status)
      ? "這筆資料已完成報到。"
      : "已取得參加者資料。",
    "success"
  );
}

function loadMyQr() {
  if (
    !Object.prototype.hasOwnProperty.call(
      EVENT_NAME_BY_CODE,
      activeEventCode
    )
  ) {
    showSection("eventPickerSection");
    showMessage("請先選擇您報名的場次。", "warning");
    return;
  }

  if (!liffReady || !liff.isLoggedIn()) {
    showMessage("請先登入 LINE。", "warning");
    return;
  }

  const idToken = liff.getIDToken();

  if (!idToken) {
    showMessage(
      "無法取得 LINE ID Token，請確認 LIFF 已啟用 openid 權限。",
      "warning"
    );
    return;
  }

  showSection(null);
  setEventHeading(activeEventCode);
  showMessage("正在查詢此場次的報到資料……");

  callServer(
    "getMyQr",
    [activeEventCode, idToken],
    function(result) {
      if (!result || !result.bound) {
        showSection("bindSection");
        $("pageTitle").textContent = "綁定我的報到資料";
        setEventHeading(activeEventCode);
        showMessage(
          "此場次尚未綁定，請輸入問卷填寫的手機號碼。"
        );
        return;
      }

      renderParticipant(result.participant);
    }
  );
}

function submitBinding() {
  const phone = $("phone").value.trim();

  if (
    !Object.prototype.hasOwnProperty.call(
      EVENT_NAME_BY_CODE,
      activeEventCode
    )
  ) {
    showSection("eventPickerSection");
    showMessage("請先選擇在職場次。", "warning");
    return;
  }

  if (!phone) {
    showMessage("請輸入手機號碼。", "warning");
    return;
  }

  if (!liffReady || !liff.isLoggedIn()) {
    showMessage("請先登入 LINE。", "warning");
    return;
  }

  const idToken = liff.getIDToken();

  if (!idToken) {
    showMessage(
      "無法取得 LINE 登入憑證，請確認 LIFF 的 openid 權限。",
      "warning"
    );
    return;
  }

  setButtonBusy("bindButton", true, "正在核對資料……");
  showMessage("正在核對手機號碼並綁定 LINE……");

  callServer(
    "bindPhone",
    [activeEventCode, phone, idToken],

    function(result) {
      setButtonBusy("bindButton", false);

      if (
        !result ||
        result.ok !== true ||
        !result.participant
      ) {
        showMessage(
          "尚未確認綁定成功，請檢查資料後再試。",
          "warning"
        );
        return;
      }

      renderParticipant(result.participant);

      showMessage(
        result.alreadyBound
          ? "此 LINE 帳號已綁定這筆資料。"
          : "LINE 綁定成功！",
        "success"
      );
    },

    function() {
      setButtonBusy("bindButton", false);
    }
  );
}

function renderStaffParticipant(participant) {
  if (!participant) {
    showMessage("查無參加者資料。", "warning");
    return;
  }

  currentParticipant = participant;
  lookupDone = true;

  const container = $("staffInfo");
  container.replaceChildren();

addField(
  container,
  "場次",
  EVENT_NAME_BY_CODE[participant.eventCode || activeEventCode] ||
    participant.eventName ||
    participant.eventCode ||
    activeEventCode
);

  addField(container, "姓名", participant.name);
  addField(container, "期別學號", participant.studentId);
  addField(
    container,
    "報到狀態",
    participant.status || "尚未報到"
  );
  addField(
    container,
    "報到時間",
    participant.checkInTime || "尚未報到"
  );

  $("checkInControls").classList.remove("hidden");
  $("pageTitle").textContent = "工作人員報到";

  const already = isAlreadyCheckedIn_(participant.status);
  $("checkInButton").disabled = already;

  showMessage(
    already
      ? "這位參加者已經報到過了，不能重複登記。"
      : "請核對場次及姓名，再按確認報到。",
    already ? "warning" : ""
  );
}

function lookupStaffParticipant() {
  const pin = $("staffPin").value.trim();

  if (!pin) {
    showMessage("請輸入工作人員 PIN。", "warning");
    return;
  }

  if (
    !currentCode ||
    !Object.prototype.hasOwnProperty.call(
      EVENT_NAME_BY_CODE,
      activeEventCode
    )
  ) {
    showMessage("報到網址缺少有效場次或識別碼。", "warning");
    return;
  }

  lookupDone = false;
  currentParticipant = null;
  $("staffInfo").replaceChildren();
  $("checkInControls").classList.add("hidden");

  setButtonBusy("lookupButton", true, "正在查詢……");
  showMessage("正在驗證工作人員並查詢資料……");

  callServer(
    "getStaffParticipant",
    [activeEventCode, currentCode, pin],

    function(result) {
      setButtonBusy("lookupButton", false);
      renderStaffParticipant(result);
    },

    function() {
      setButtonBusy("lookupButton", false);
    }
  );
}

function confirmCheckIn() {
  if (!lookupDone || !currentParticipant || !currentCode) {
    showMessage("請先驗證工作人員並查詢參加者。", "warning");
    return;
  }

  if (isAlreadyCheckedIn_(currentParticipant.status)) {
    showMessage("這位參加者已經報到過了。", "warning");
    return;
  }

  const pin = $("staffPin").value.trim();
  const device = $("device").value.trim();

  if (!pin || !device) {
    showMessage("請輸入工作人員 PIN 及設備名稱。", "warning");
    return;
  }

  if (device.length > 50) {
    showMessage("報到設備名稱不可超過 50 個字元。", "warning");
    return;
  }

  if (!confirm("確定要將這位參加者登記為已報到嗎？")) {
    return;
  }

  setButtonBusy("checkInButton", true, "正在登記報到……");

  callServer(
    "staffCheckIn",
    [activeEventCode, currentCode, device, pin],

    function(result) {
      setButtonBusy("checkInButton", false);

      if (result && result.participant) {
        renderStaffParticipant(result.participant);
      }

      if (result && result.already) {
        showMessage("這位參加者已經報到過了。", "warning");
      } else if (result && result.ok) {
        showMessage("報到成功！", "success");
      } else {
        showMessage(
          "後端未確認報到成功，請核對執行結果。",
          "warning"
        );
      }
    },

    function() {
      setButtonBusy("checkInButton", false);
    }
  );
}

function testBackendConnection_() {
  showMessage("正在測試 Apps Script 後端連線……");

  callServer(
    "ping",
    [],
    function(result) {
      showMessage(
        result && result.message
          ? result.message
          : "後端有回覆，但回覆格式與預期不同。",
        result && result.message ? "success" : "warning"
      );
    }
  );
}

async function initApp() {
  if (
    new URLSearchParams(window.location.search).get("apiTest") === "1"
  ) {
    showSection("apiTestSection");
    $("pageTitle").textContent = "後端連線測試";
    showMessage(
      "可測試 API 橋接。此頁不會初始化 LIFF，也不會修改場次資料。"
    );
    return;
  }

  if (INITIAL_MODE === "staff") {
    const state = readParamsAfterLiffInit_();

    activeEventCode = state.eventCode;
    currentCode = state.code;

    if (
      !Object.prototype.hasOwnProperty.call(
        EVENT_NAME_BY_CODE,
        activeEventCode
      ) ||
      !currentCode
    ) {
      showMessage(
        "工作人員報到網址缺少有效場次或識別碼，" +
        "請重新掃描正確的報到 QR Code。",
        "warning"
      );
      return;
    }

    showSection("staffSection");
    $("pageTitle").textContent = "工作人員報到";
    setEventHeading(activeEventCode);
    showMessage("請輸入工作人員 PIN，開始查詢。");
    return;
  }

  if (typeof window.liff === "undefined") {
    showMessage(
      "LIFF SDK 未載入，請檢查網路或 SDK 網址。",
      "warning"
    );
    return;
  }

  try {
    showMessage("正在初始化 LINE LIFF……");

    await liff.init({
      liffId: LIFF_ID
    });

    liffReady = true;
    routeParticipantByEvent_();

  } catch (error) {
    showMessage(
      "LINE 初始化失敗：" +
      (
        error && error.message
          ? error.message
          : String(error)
      ) +
      "\n請檢查 LIFF ID、Endpoint URL 及登入權限。",
      "warning"
    );
  }
}

window.addEventListener("load", initApp);
</script>
</body>
</html>
