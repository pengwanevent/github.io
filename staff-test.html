<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5EFFB">
  <title>在職報到系統｜工作人員測試版</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #F5EFFB;
      --card: #FFFFFF;
      --pink: #D99AB7;
      --pink-dark: #8E5876;
      --pink-light: #FCEAF2;
      --text: #4F4058;
      --muted: #756681;
      --border: #DCCDEB;
      --orange: #9A5B2D;
      --orange-bg: #FFF0E1;
      --purple: #A98BCB;
      --purple-bg: #E9DDF5;
      --red: #A93232;
      --red-bg: #FFF0EF;
    }

    /* 已報到提示：大字、粗體、紅色 */
    .already-checked-in {
      color: #A93232 !important;
      font-size: 26px !important;
      font-weight: 900 !important;
      line-height: 1.5;
    }

    body {
      margin: 0;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      font-family: Arial, "Noto Sans TC", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.65;
      font-size: 18px;
      -webkit-text-size-adjust: 100%;
    }

    main {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 4px 18px;
}

.hero-brand {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  white-space: nowrap;
}

.hero-icon {
  display: flex;
  flex: 0 0 64px;
  width: 64px;
  height: 64px;
  margin: 0;
  align-items: center;
  justify-content: center;
  border-radius: 20px;
  background: linear-gradient(145deg, #F8DCE9, #DCC8F0);
  border: 2px solid #DCCDEB;
  box-shadow: 0 5px 14px rgba(169, 139, 203, 0.18);
  font-size: 40px;
}

h1 {
  flex: 0 1 auto;
  min-width: 0;
  margin: 0;
  font-size: clamp(21px, 5.8vw, 30px);
  line-height: 1.3;
  font-weight: 850;
  letter-spacing: 0.5px;
  text-align: left;
  white-space: nowrap;
}
    h2 {
      margin: 0 0 14px;
      font-size: 24px;
      line-height: 1.4;
      text-align: center;
    }

    p { margin: 8px 0 14px; }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 16px;
      text-align: center;
    }

    .test-banner {
      margin: 12px auto 0;
      max-width: 460px;
      padding: 10px 14px;
      border: 1px solid #DCCDEB;
      border-radius: 14px;
      background: linear-gradient(100deg, #FFE8D1, #F8DCE9 52%, #E9DDF5);
      color: #5B456C;
      font-size: 14px;
      font-weight: 750;
      text-align: center;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px 18px;
      margin: 16px 0;
      box-shadow: 0 4px 16px rgba(201, 185, 223, 0.08);
    }

    .hidden { display: none !important; }

    .muted {
      color: var(--muted);
      font-size: 16px;
      text-align: center;
    }

    input, button {
      width: 100%;
      min-height: 56px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 19px;
      line-height: 1.4;
      border-radius: 14px;
      margin-top: 12px;
    }

    input {
      border: 2px solid var(--border);
      background: #fff;
      color: var(--text);
      text-align: center;
    }

    input:focus {
      outline: 3px solid #F7F1FC;
      border-color: var(--pink);
    }

    button {
      border: 0;
      background: var(--pink);
      color: #fff;
      font-weight: 750;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover { background: var(--pink-dark); }
    button:active { transform: scale(0.99); }

    button.secondary {
      color: var(--pink-dark);
      background: #FAF7FD;
      border: 1px solid #EEE7F4;
    }

    button.secondary:hover { background: #F7F1FC; }

    button.danger {
      color: #fff;
      background: #A93232;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .login-badge {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--pink-light);
      color: var(--pink-dark);
      font-size: 16px;
      font-weight: 700;
      text-align: center;
    }

    .center, #loginStatus { text-align: center; }

    #loginStatus { margin-bottom: 12px; }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 16px;
      background: #FCFAFE;
      border: 1px solid var(--border);
      margin: 16px auto;
    }

    #reader video { border-radius: 12px; }

    #reader__dashboard_section_csr button,
    #reader__dashboard_section_swaplink {
      font-size: 16px !important;
    }

    .scan-hint {
      background: #FFF0E1;
      border: 1px solid #EEE7F4;
      border-radius: 14px;
      padding: 12px;
      color: var(--pink-dark);
      text-align: center;
      font-size: 16px;
    }

    .status {
      font-size: 21px;
      font-weight: 800;
      text-align: center;
      padding: 14px 10px;
      border-radius: 14px;
      margin: 16px 0;
      background: var(--pink-light);
      color: var(--pink-dark);
      overflow-wrap: anywhere;
    }

    .ok {
      color: var(--pink-dark);
      background: var(--pink-light);
    }

    .warn {
      color: var(--orange);
      background: var(--orange-bg);
    }

    .err {
      color: var(--red);
      background: var(--red-bg);
    }

    .participant-name {
      font-size: 32px;
      font-weight: 850;
      text-align: center;
      line-height: 1.4;
      overflow-wrap: anywhere;
      margin: 12px 0 20px;
    }

    .participant-info {
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .field {
      padding: 14px 12px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    .field:last-child { border-bottom: 0; }

    .label {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 4px;
    }

    .value {
      font-size: 22px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    #message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      text-align: center;
      font-size: 18px;
      font-weight: 650;
      padding: 12px 4px;
    }

    .message-card { padding: 14px 18px; }

.next-button {
  min-height: 62px;
  font-size: 21px;
  font-weight: 850;
  margin: 0 0 20px;

  /* 醒目的粉橘色 */
  color: #FFFFFF !important;
  background: linear-gradient(100deg, #F29A8B, #F5A66F) !important;
  border: 2px solid #ED927B;
  box-shadow: 0 4px 10px rgba(237, 146, 123, 0.28);
}

.next-button:hover {
  background: linear-gradient(100deg, #E98278, #ED914F) !important;
}

.next-button:active {
  transform: scale(0.98);
}

    .footer-note {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      margin: 22px 0 8px;
    }

    dialog {
      width: calc(100% - 28px);
      max-width: 430px;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px 20px;
      color: var(--text);
      background: #fff;
      box-shadow: 0 12px 50px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    dialog::backdrop { background: rgba(79, 64, 88, 0.45); }

    #confirmText {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 19px;
      line-height: 1.8;
      text-align: center;
      margin: 18px 0;
    }

    @media (max-width: 380px) {
      body {
        padding-left: 10px;
        padding-right: 10px;
      }

      .card { padding: 18px 13px; }
      h1 { font-size: 27px; }
      .participant-name { font-size: 28px; }
      .value { font-size: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>

<body>
<main>
  <header class="hero">
 <div class="hero-brand">
  <div class="hero-icon" aria-label="Q版大象" role="img">🐘</div>
  <h1>在職報到系統</h1>
</div>
    <p class="subtitle">工作人員專用｜測試版</p>
    <div class="test-banner" role="status">測試版｜可登入及查詢，但不會寫入正式報到資料</div>
  </header>

  <section class="card" id="loginPanel">
    <h2>工作人員登入</h2>
    <p class="muted">請輸入登入者名稱及工作人員 PIN，登入後即可開始掃描報到。</p>

    <form id="loginForm">
      <input
        id="deviceName"
        type="text"
        maxlength="10"
        autocomplete="off"
        placeholder="請輸入登入者（最多 10 個字）"
        aria-label="登入者"
        required
      >
      <input
        id="pin"
        type="password"
        inputmode="numeric"
        autocomplete="current-password"
        placeholder="請輸入工作人員 PIN"
        aria-label="工作人員 PIN"
        required
      >
      <button id="loginButton" type="submit">登入工作人員系統</button>
    </form>

    <button id="showSetupButton" type="button" class="secondary">首次設定正式 PIN</button>

    <form id="setupPinForm" class="hidden" autocomplete="off">
      <h2 style="margin-top:22px">設定正式工作人員 PIN</h2>
      <p class="muted">僅供正式系統第一次啟用。需要管理驗證碼；設定完成後，此畫面不能再次修改 PIN。</p>
      <input
        id="setupKey"
        type="password"
        autocomplete="off"
        placeholder="請輸入初次設定驗證碼"
        aria-label="初次設定驗證碼"
        required
      >
      <input
        id="setupPin"
        type="password"
        inputmode="numeric"
        autocomplete="new-password"
        pattern="[0-9]{6,12}"
        minlength="6"
        maxlength="12"
        placeholder="設定 6 至 12 位數字 PIN"
        aria-label="新的工作人員 PIN"
        required
      >
      <input
        id="setupPinConfirm"
        type="password"
        inputmode="numeric"
        autocomplete="new-password"
        pattern="[0-9]{6,12}"
        minlength="6"
        maxlength="12"
        placeholder="再次輸入新 PIN"
        aria-label="確認新的工作人員 PIN"
        required
      >
      <button id="saveSetupPinButton" type="submit">儲存正式 PIN</button>
      <button id="cancelSetupButton" type="button" class="secondary">取消</button>
    </form>
  </section>

  <!-- 參加者資料放在相機區上方 -->
  <section class="card hidden" id="participantPanel">
    <button id="nextButton" class="secondary next-button">掃描下一位</button>

    <h2>參加者資料</h2>
    <div id="participantInfo" class="participant-info"></div>
    <p id="participantStatus" class="status" aria-live="polite"></p>
    <button id="checkInButton">確認報到</button>
  </section>

  <!-- 相機及登入狀態區放在下方 -->
  <section class="card hidden" id="scannerPanel">
    <div id="loginStatus">
      <span class="login-badge">✓ 工作人員已登入</span>
    </div>

    <h2>📷 掃描參加者 QR Code</h2>
    <p class="muted">請將參加者的 QR Code 對準相機畫面。</p>

    <div id="reader"></div>

    <div class="scan-hint">
      請確認參加者出示的是活動報到 QR Code。
    </div>

    <button id="startButton">啟動相機</button>
    <button id="stopButton" class="secondary">停止相機</button>
    <button id="logoutButton" class="danger">登出</button>
  </section>

  <section class="card message-card">
    <div id="message" role="status" aria-live="polite">請先登入。</div>
  </section>

  <p class="footer-note">在職報到系統・工作人員測試介面</p>
</main>

<dialog id="confirmDialog">
  <h2>確認報到</h2>
  <p id="confirmText">請確認參加者資料。</p>
  <button id="confirmYes">✓ 確認，執行報到</button>
  <button id="confirmNo" class="secondary">返回確認資料</button>
</dialog>

<iframe name="postFrame" id="postFrame" class="hidden"></iframe>

<script>
"use strict";

const GAS_API_URL =
  "https://script.google.com/macros/s/AKfycbyPPjPvjmdblS0njmuUYXXcLMhxyeCEOUpBBh5p9TaAQILyi2czWrgW1I8B_xZfCkhZMA/exec";

let currentDeviceName = "";
let currentPin = "";

const $ = id => document.getElementById(id);

let session = ""; // 僅標記目前頁面已通過 PIN 驗證，不存入 localStorage。
let scanner = null;
let cameraRunning = false;
let busy = false;
let currentCode = "";
let currentParticipant = null;

/* =========================
   共用訊息及畫面功能
========================= */

function message(text, type = "") {
  $("message").className = type;
  $("message").textContent = text;
}

function show(el, yes) {
  el.classList.toggle("hidden", !yes);
}

/* =========================
   呼叫正式版 Apps Script API Bridge
========================= */

const REQUEST_TIMEOUT_MS = 25000;
const pendingRequests = new Map();

window.addEventListener("message", function(event) {
  const data = event.data;
  if (!data || data.channel !== "pengwanevent-gas-bridge" || !data.requestId) return;

  const requestId = String(data.requestId);
  const pending = pendingRequests.get(requestId);
  if (!pending) return;

  // Apps Script 沙盒可能回報 opaque origin（"null"）。
  let originAllowed = event.origin === "null";
  try {
    const host = new URL(event.origin).hostname;
    originAllowed = originAllowed || host === "script.google.com" ||
      host === "googleusercontent.com" || host.endsWith(".googleusercontent.com");
  } catch (err) {
    // opaque origin
  }
  if (!originAllowed) return;

  clearTimeout(pending.timer);
  pendingRequests.delete(requestId);
  if (pending.iframe && pending.iframe.parentNode) pending.iframe.parentNode.removeChild(pending.iframe);
  if (pending.form && pending.form.parentNode) pending.form.parentNode.removeChild(pending.form);

  if (data.ok) pending.resolve(data.data);
  else pending.reject(new Error(data.error || "Apps Script 後端發生錯誤。"));
});

function api(method, args = []) {
  // 測試版安全護欄：禁止會寫入正式資料的操作。
  if (method === "staffCheckInByCode" || method === "setupStaffPinFromApp") {
    return Promise.reject(new Error(
      "這是 staff-test 測試版，已停用正式資料寫入。確認畫面與操作流程時，不會真的執行報到或設定 PIN。"
    ));
  }

  return new Promise((resolve, reject) => {
    const requestId = "staff_test_" + Date.now().toString(36) + "_" +
      Math.random().toString(36).slice(2, 12);
    const frameName = "gas_frame_" + requestId;

    const iframe = document.createElement("iframe");
    iframe.name = frameName;
    iframe.title = "背景 API 連線";
    iframe.setAttribute("aria-hidden", "true");
    iframe.style.cssText = "position:fixed;left:-10000px;top:-10000px;width:1px;height:1px;border:0";

    const form = document.createElement("form");
    form.method = "POST";
    form.action = GAS_API_URL;
    form.target = frameName;
    form.style.display = "none";

    const payloadInput = document.createElement("input");
    payloadInput.type = "hidden";
    payloadInput.name = "payload";
    payloadInput.value = JSON.stringify({ method, args: args || [] });

    const requestInput = document.createElement("input");
    requestInput.type = "hidden";
    requestInput.name = "requestId";
    requestInput.value = requestId;
    form.append(payloadInput, requestInput);

    const timer = setTimeout(() => {
      pendingRequests.delete(requestId);
      if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
      if (form.parentNode) form.parentNode.removeChild(form);
      reject(new Error("連線逾時：正式 Apps Script 後端沒有回覆。請確認 ApiBridge.gs 已更新並部署最新版本。"));
    }, REQUEST_TIMEOUT_MS);

    pendingRequests.set(requestId, { resolve, reject, timer, iframe, form });
    document.body.append(iframe, form);

    try {
      form.submit();
    } catch (err) {
      clearTimeout(timer);
      pendingRequests.delete(requestId);
      if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
      if (form.parentNode) form.parentNode.removeChild(form);
      reject(new Error("無法送出請求：" + (err.message || String(err))));
    }
  });
}

/* =========================
   相機功能
========================= */

async function stopCamera() {
  if (!scanner) return;

  try {
    if (cameraRunning) {
      await scanner.stop();
    }
  } catch (err) {
    console.warn("停止相機時發生問題：", err);
  }

  cameraRunning = false;
}

async function startScanner() {
  if (busy || cameraRunning) return;

  if (!session) {
    message("工作階段不存在，請重新登入。", "err");
    return;
  }

  if (!window.Html5Qrcode) {
    message(
      "掃描元件載入失敗，請確認網路後重新整理。",
      "err"
    );
    return;
  }

  try {
    if (!scanner) {
      scanner = new Html5Qrcode("reader");
    }

    message("正在啟動相機……");

    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      decodedText => {
        if (!busy && !currentCode) {
          handleScan(decodedText);
        }
      },
      () => {}
    );

    cameraRunning = true;
    message("相機已啟動，請掃描參加者 QR Code。", "ok");

  } catch (err) {
    cameraRunning = false;

    message(
      "無法啟動相機。\n" +
      (err && err.message ? err.message : String(err)) +
      "\n\n請確認使用 HTTPS、瀏覽器相機權限已開啟，並允許此網站使用相機。",
      "err"
    );
  }
}

function extractCode(text) {
  const raw = String(text || "").trim();

  try {
    const url = new URL(raw);
    const code = url.searchParams.get("code");

    if (code) return code.trim();
  } catch (_) {}

  if (/^[A-Za-z0-9_-]{4,80}$/.test(raw)) {
    return raw;
  }

  throw new Error("無法從 QR Code 讀取有效的報到識別碼。");
}

/* =========================
   掃描及查詢參加者
========================= */

async function handleScan(decodedText) {
  if (busy || currentCode) return;

  busy = true;

  try {
    await stopCamera();

    const code = extractCode(decodedText);

    message("已讀取 QR Code，正在查詢參加者……");

    const result = await api("getStaffParticipantByCode", [code, currentPin]);

    if (!result.success) {
      if (/工作階段|重新驗證|逾期|無效|PIN 不正確|PIN 驗證/.test(result.message || "")) {
        await expireSession(result.message);
        return;
      }

      throw new Error(result.message || "查詢失敗。");
    }

    currentCode = code;
    currentParticipant = result.participant;

    renderParticipant(currentParticipant);

    show($("participantPanel"), true);

    message("查詢成功，請確認參加者資料。", "ok");

    $("participantPanel").scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  } catch (err) {
    message(err.message || String(err), "err");

    currentCode = "";
    currentParticipant = null;

  } finally {
    busy = false;
  }
}

/* =========================
   顯示參加者資料
   注意：此函式只負責更新畫面
========================= */

function isAlreadyCheckedInStatus(value) {
  const normalized = String(value || "").trim().replace(/[\s\u3000]/g, "");
  return ["已報到", "已完成報到", "報到完成"].indexOf(normalized) >= 0;
}

function renderParticipant(p) {
  const info = $("participantInfo");

  info.replaceChildren();

  const name = document.createElement("div");
  name.className = "participant-name";
  name.textContent = p.name || "未提供姓名";

  info.appendChild(name);

  // 不顯示參加人數
  const fields = [
    ["期別學號", p.studentId],
    ["報到時間", p.checkInTime || "—"],
    ["報到設備", p.device || "—"]
  ];

  fields.forEach(([label, value]) => {
    const row = document.createElement("div");
    row.className = "field";

    const labelEl = document.createElement("div");
    labelEl.className = "label";
    labelEl.textContent = label;

    const valueEl = document.createElement("div");
    valueEl.className = "value";

    valueEl.textContent =
      value == null || value === "" ? "—" : value;

    row.append(labelEl, valueEl);
    info.appendChild(row);
  });

  const already = isAlreadyCheckedInStatus(p.status);

  const statusEl = $("participantStatus");

  statusEl.textContent = already
    ? "✓ 此參加者已經報到"
    : "尚未報到";

  statusEl.className =
    "status " + (already ? "warn" : "ok");

  statusEl.classList.toggle(
    "already-checked-in",
    already
  );

  const checkInButton = $("checkInButton");

  checkInButton.disabled = already;

  checkInButton.textContent = already
    ? "已報到，不可重複報到"
    : "確認報到";

  checkInButton.classList.toggle(
    "already-checked-in",
    already
  );
}

/* =========================
   確認報到按鈕
   事件只註冊一次
========================= */

$("checkInButton").addEventListener("click", () => {
  if (!currentParticipant || !currentCode || busy) return;

  if (isAlreadyCheckedInStatus(currentParticipant.status)) {
    message(
      "此參加者已經報到，不會再次寫入。",
      "warn"
    );
    return;
  }

  // 確認視窗不顯示參加人數
  $("confirmText").textContent =
    "確認為「" + currentParticipant.name +
    "」執行報到？\n期別學號：" +
    currentParticipant.studentId;

  $("confirmDialog").showModal();
});

/* =========================
   取消確認
========================= */

$("confirmNo").addEventListener("click", () => {
  $("confirmDialog").close();
});

/* =========================
   執行報到
========================= */

$("confirmYes").addEventListener("click", async () => {
  $("confirmDialog").close();

  if (busy || !currentCode || !session) return;

  if (
    currentParticipant &&
    isAlreadyCheckedInStatus(currentParticipant.status)
  ) {
    message(
      "此參加者已經報到，不會再次寫入。",
      "warn"
    );
    renderParticipant(currentParticipant);
    return;
  }

  busy = true;
  $("checkInButton").disabled = true;

  message("正在寫入報到資料……");

  try {
    const result = await api("staffCheckInByCode", [currentCode, currentDeviceName, currentPin]);

    if (!result.success) {
      if (/工作階段|重新驗證|逾期|無效|PIN 不正確|PIN 驗證/.test(result.message || "")) {
        await expireSession(result.message);
        return;
      }

      throw new Error(result.message || "報到失敗。");
    }

    currentParticipant = result.participant;

    renderParticipant(currentParticipant);

    if (result.already) {
      message(
        "此參加者已經報到，系統未重複寫入。",
        "warn"
      );
    } else if (result.ok) {
      message("✓ 報到完成！", "ok");
    } else {
      message(
        "後端未確認報到完成，請核對試算表。",
        "err"
      );
    }

  } catch (err) {
    message(
      (err.message || String(err)) +
      "\n若不確定後端是否已寫入，請先重新查詢，不要連續重試。",
      "err"
    );

  } finally {
    busy = false;

    $("checkInButton").disabled =
      !currentParticipant ||
      isAlreadyCheckedInStatus(currentParticipant.status);
  }
});

/* =========================
   掃描下一位
========================= */

$("nextButton").addEventListener("click", async () => {
  if (busy) return;

  currentCode = "";
  currentParticipant = null;

  show($("participantPanel"), false);

  message("準備掃描下一位……");

  $("scannerPanel").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

  await startScanner();
});

/* =========================
   啟動／停止相機
========================= */

$("startButton").addEventListener("click", startScanner);

$("stopButton").addEventListener("click", async () => {
  await stopCamera();

  message("相機已停止。按「啟動相機」可繼續掃描。");
});

/* =========================
   工作階段失效
========================= */

async function expireSession(reason) {
  await stopCamera();

  session = "";
  currentPin = "";
  currentDeviceName = "";

  currentCode = "";
  currentParticipant = null;

  show($("loginPanel"), true);
  show($("scannerPanel"), false);
  show($("participantPanel"), false);

  message(
    (reason || "工作階段已失效。") +
    "\n請重新輸入工作人員 PIN。",
    "err"
  );

  $("loginPanel").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

/* =========================
   登出
========================= */

$("logoutButton").addEventListener("click", async () => {
  await stopCamera();

  session = "";
  currentPin = "";
  currentDeviceName = "";
  currentCode = "";
  currentParticipant = null;

  show($("loginPanel"), true);
  show($("scannerPanel"), false);
  show($("participantPanel"), false);

  message("已登出。");

  $("loginPanel").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
});

/* =========================
   正式 PIN 初次設定（在 APP 內完成）
========================= */

$("showSetupButton").addEventListener("click", () => {
  show($("setupPinForm"), true);
  $("setupKey").focus();
  message("請輸入初次設定驗證碼及新的正式 PIN。", "");
  $("setupPinForm").scrollIntoView({ behavior: "smooth", block: "center" });
});

$("cancelSetupButton").addEventListener("click", () => {
  $("setupPinForm").reset();
  show($("setupPinForm"), false);
  message("已取消 PIN 設定。", "");
});

$("setupPinForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (busy) return;

  const setupKey = $("setupKey").value.trim();
  const newPin = $("setupPin").value.trim();
  const confirmPin = $("setupPinConfirm").value.trim();

  if (!setupKey) {
    message("請輸入初次設定驗證碼。", "err");
    $("setupKey").focus();
    return;
  }

  if (!/^\d{6,12}$/.test(newPin)) {
    message("正式工作人員 PIN 必須是 6 至 12 位數字。", "err");
    $("setupPin").focus();
    return;
  }

  if (newPin !== confirmPin) {
    message("兩次輸入的 PIN 不一致，請重新確認。", "err");
    $("setupPinConfirm").focus();
    return;
  }

  if (!confirm("確定要將此 PIN 設為正式系統唯一的工作人員 PIN 嗎？設定後不能從此畫面再次修改。")) return;

  busy = true;
  $("saveSetupPinButton").disabled = true;
  message("正在安全設定正式 PIN……");

  try {
    const result = await api("setupStaffPinFromApp", [setupKey, newPin]);

    if (!result || result.success !== true) {
      throw new Error((result && result.message) || "正式 PIN 設定失敗。");
    }

    $("setupPinForm").reset();
    show($("setupPinForm"), false);
    $("showSetupButton").disabled = true;
    $("showSetupButton").textContent = "正式 PIN 已完成初次設定";
    $("pin").value = "";

    message("✓ 正式工作人員 PIN 已設定完成！請在上方登入畫面輸入新 PIN。", "ok");

  } catch (err) {
    message(err.message || String(err), "err");

  } finally {
    busy = false;
    $("saveSetupPinButton").disabled = false;
  }
});

/* =========================
   工作人員登入
========================= */

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (busy) return;

  const pin = $("pin").value.trim();
  const deviceName = $("deviceName").value.trim();

  if (!deviceName) {
    message("請輸入登入者名稱。", "err");
    $("deviceName").focus();
    return;
  }

  if (deviceName.length > 10) {
    message("登入者名稱最多只能輸入 10 個字元。", "err");
    $("deviceName").focus();
    return;
  }

  if (!pin) {
    message("請輸入工作人員 PIN。", "err");
    return;
  }

  busy = true;
  $("loginButton").disabled = true;

  message("正在驗證工作人員……");

  try {
    const result = await api("verifyStaffPin", [pin]);

    if (!result || result.success !== true) {
      throw new Error((result && result.message) || "工作人員 PIN 驗證失敗。");
    }

    // PIN 僅保存在目前頁面的記憶體，查詢與報到時由後端再次驗證。
    currentPin = pin;
    session = "verified";
    currentDeviceName = deviceName;

    $("pin").value = "";

    show($("loginPanel"), false);
    show($("participantPanel"), false);
    show($("scannerPanel"), true);

    message("PIN 驗證成功（登入者：" + currentDeviceName + "），請啟動相機。", "ok");

    $("loginStatus").innerHTML =
      '<span class="login-badge">✓ 已登入：' +
      currentDeviceName.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]) +
      '</span>';

    $("scannerPanel").scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  } catch (err) {
    message(err.message || String(err), "err");

  } finally {
    busy = false;
    $("loginButton").disabled = false;
  }
});

/* =========================
   頁面初始狀態
   每次開啟都要求重新登入
========================= */

show($("loginPanel"), true);
show($("scannerPanel"), false);
show($("participantPanel"), false);

message("請登入後開始報到。");
</script>

</body>
</html>
