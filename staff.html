<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#176b55">
  <title>工作人員報到｜婉如基金會</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --green: #176b55;
      --green-dark: #124c3e;
      --green-light: #edf6f1;
      --text: #263b32;
      --muted: #68796f;
      --border: #e2eae5;
      --warning: #a33b30;
    }

    body {
      margin: 0;
      padding: 20px 14px 36px;
      background: #f3f6f4;
      color: var(--text);
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    .page {
      max-width: 520px;
      margin: 0 auto;
    }

    .hero {
      padding: 25px 21px;
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      box-shadow: 0 8px 22px rgba(23, 107, 85, .14);
    }

    .brand {
      margin-bottom: 9px;
      color: #d7eee4;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    h1 {
      margin: 0 0 9px;
      font-size: 25px;
      line-height: 1.4;
    }

    .hero p {
      margin: 0;
      color: #e4f2eb;
      font-size: 13px;
      line-height: 1.8;
    }

    .card {
      margin-top: 17px;
      padding: 20px 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 3px 13px rgba(30, 60, 45, .04);
    }

    .event-box {
      padding: 14px;
      border-radius: 12px;
      background: var(--green-light);
    }

    .event-label {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .event-name {
      color: var(--green);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .section-title {
      margin: 20px 0 7px;
      font-size: 17px;
    }

    .helper {
      margin: 0 0 15px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 12px 13px;
      border: 1px solid #cbd8cf;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid rgba(23, 107, 85, .18);
      border-color: var(--green);
    }

    button {
      display: block;
      width: 100%;
      min-height: 49px;
      margin-top: 13px;
      padding: 13px 15px;
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f7f9f7;
      color: #496254;
      font-size: 14px;
      line-height: 1.8;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message:empty {
      display: none;
    }

    .message.success {
      border-color: #c6e5d3;
      background: #edf8f0;
      color: #176b45;
    }

    .message.warning {
      border-color: #f0d1cb;
      background: #fff3f1;
      color: var(--warning);
    }

    .participant-card {
      margin-top: 17px;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fbfcfb;
    }

    .participant-card:empty {
      display: none;
    }

    .field {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid #e9efeb;
      font-size: 14px;
      line-height: 1.6;
    }

    .field:last-child {
      border-bottom: 0;
    }

    .field-label {
      flex-shrink: 0;
      color: var(--muted);
    }

    .field-value {
      text-align: right;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .device-box {
      margin-top: 17px;
      padding: 14px;
      border-radius: 12px;
      background: #f3f6f4;
    }

    .checkin-button {
      min-height: 54px;
      margin-top: 16px;
      font-size: 17px;
    }

    .footnote {
      margin-top: 16px;
      color: #819087;
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="hero">
      <div class="brand">EVENT CHECK-IN</div>
      <h1>工作人員報到</h1>
      <p>
        請核對參加者資料，再完成報到登記。<br>
        場次由原本 QR Code 自動帶入。
      </p>
    </header>

    <section class="card">
      <div class="event-box">
        <div class="event-label">目前報到場次</div>
        <div id="eventName" class="event-name">正在讀取場次……</div>
      </div>

      <h2 class="section-title">工作人員驗證</h2>
      <p class="helper">
        請輸入工作人員 PIN。驗證成功後，系統會查詢這筆 QR Code 對應的參加者。
      </p>

      <label for="staffPin">工作人員 PIN</label>
      <input
        id="staffPin"
        type="password"
        inputmode="numeric"
        autocomplete="off"
        placeholder="請輸入工作人員 PIN">

      <button id="lookupButton" type="button">
        驗證 PIN 並查詢資料
      </button>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <div id="staffInfo" class="participant-card"></div>

      <div id="checkInControls" class="hidden">
        <div class="device-box">
          <label for="device">報到設備名稱</label>
          <input
            id="device"
            type="text"
            maxlength="50"
            value="報到手機1"
            autocomplete="off">
          <p class="helper" style="margin:8px 0 0">
            多支手機可分別設定設備名稱，以利辨識報到紀錄。
          </p>
        </div>

        <button id="checkInButton" class="checkin-button" type="button">
          確認報到
        </button>
      </div>
    </section>

    <p class="footnote">
      婉如基金會活動報到系統<br>
      請勿將工作人員 PIN 提供給參加者。
    </p>
  </main>

  <script>
    "use strict";

    // 正式 Apps Script Web App；沿用既有 API Bridge。
    const GAS_API_URL =
      "https://script.google.com/macros/s/AKfycbyPPjPvjmdblS0njmuUYXXcLMhxyeCEOUpBBh5p9TaAQILyi2czWrgW1I8B_xZfCkhZMA/exec";

    const EVENT_NAME_BY_CODE = {
      "1115": "婉如基金會在職11/15場次",
      "1121": "婉如基金會在職11/21場次",
      "1122": "婉如基金會在職11/22場次"
    };

    const REQUEST_TIMEOUT_MS = 25000;
    const params = new URLSearchParams(window.location.search);

    // 沿用既有 QR Code 網址中的參數，不讓工作人員選場次。
    const EVENT_CODE = String(params.get("event") || "").trim();
    const CURRENT_CODE = String(params.get("code") || "").trim();

    const $ = id => document.getElementById(id);
    const pendingRequests = new Map();

    let lookupDone = false;
    let currentParticipant = null;
    let requestSequence = 0;

    function showMessage(text, type = "") {
      const el = $("message");
      el.textContent = String(text || "");
      el.className = "message" + (type ? " " + type : "");
    }

    function setBusy(buttonId, busy, busyText) {
      const button = $(buttonId);

      if (!button) return;

      if (!button.dataset.originalText) {
        button.dataset.originalText = button.textContent.trim();
      }

      button.disabled = Boolean(busy);
      button.textContent = busy
        ? busyText
        : button.dataset.originalText;
    }

    function addField(container, label, value) {
      const row = document.createElement("div");
      row.className = "field";

      const left = document.createElement("span");
      left.className = "field-label";
      left.textContent = label;

      const right = document.createElement("strong");
      right.className = "field-value";
      right.textContent =
        value === null || value === undefined || value === ""
          ? "未提供"
          : String(value);

      row.append(left, right);
      container.appendChild(row);
    }

    function validEvent() {
      return Object.prototype.hasOwnProperty.call(
        EVENT_NAME_BY_CODE,
        EVENT_CODE
      );
    }

    function initPage() {
      if (!validEvent()) {
        $("eventName").textContent = "場次資料無效";
        showMessage(
          "網址缺少有效的 event 參數，請使用原本正確的報到 QR Code。",
          "warning"
        );
        $("lookupButton").disabled = true;
        return;
      }

      $("eventName").textContent = EVENT_NAME_BY_CODE[EVENT_CODE];

      if (!CURRENT_CODE) {
        showMessage(
          "網址缺少參加者識別碼，請重新掃描原本的報到 QR Code。",
          "warning"
        );
        $("lookupButton").disabled = true;
        return;
      }

      showMessage("已讀取報到資料，請輸入工作人員 PIN。");
    }

    /*
     * 使用既有 ApiBridge.gs 的 POST + iframe + postMessage 方式。
     * 不使用 google.script.run，因為這個頁面是放在 GitHub Pages。
     */
    window.addEventListener("message", function(event) {
      const data = event.data;

      if (
        !data ||
        data.channel !== "pengwanevent-gas-bridge" ||
        !data.requestId
      ) {
        return;
      }

      const requestId = String(data.requestId);
      const pending = pendingRequests.get(requestId);

      if (!pending) return;

      let originAllowed = event.origin === "null";

      try {
        const hostname = new URL(event.origin).hostname;

        originAllowed = originAllowed ||
          hostname === "script.google.com" ||
          hostname === "googleusercontent.com" ||
          hostname.endsWith(".googleusercontent.com");
      } catch (error) {
        // Google Apps Script 的沙盒回應可能是 opaque origin。
      }

      if (!originAllowed) return;

      clearTimeout(pending.timer);
      pendingRequests.delete(requestId);

      if (pending.iframe && pending.iframe.parentNode) {
        pending.iframe.parentNode.removeChild(pending.iframe);
      }

      if (pending.form && pending.form.parentNode) {
        pending.form.parentNode.removeChild(pending.form);
      }

      if (data.ok) {
        pending.resolve(data.data);
      } else {
        pending.reject(
          new Error(data.error || "Apps Script 後端發生錯誤。")
        );
      }
    });

    function callServer(method, args) {
      return new Promise(function(resolve, reject) {
        requestSequence += 1;

        const requestId =
          "staff_" +
          Date.now().toString(36) +
          "_" +
          requestSequence +
          "_" +
          Math.random().toString(36).slice(2, 8);

        const frameName = "gas_frame_" + requestId;

        const iframe = document.createElement("iframe");
        iframe.name = frameName;
        iframe.title = "背景 API 連線";
        iframe.setAttribute("aria-hidden", "true");
        iframe.style.cssText =
          "position:fixed;left:-10000px;top:-10000px;" +
          "width:1px;height:1px;border:0";

        const form = document.createElement("form");
        form.method = "POST";
        form.action = GAS_API_URL;
        form.target = frameName;
        form.style.display = "none";

        const payloadInput = document.createElement("input");
        payloadInput.type = "hidden";
        payloadInput.name = "payload";
        payloadInput.value = JSON.stringify({
          method: method,
          args: args || []
        });

        const requestInput = document.createElement("input");
        requestInput.type = "hidden";
        requestInput.name = "requestId";
        requestInput.value = requestId;

        form.append(payloadInput, requestInput);

        const timer = setTimeout(function() {
          pendingRequests.delete(requestId);

          if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
          if (form.parentNode) form.parentNode.removeChild(form);

          reject(
            new Error(
              "後端連線逾時。請確認 ApiBridge.gs 已部署最新版本。"
            )
          );
        }, REQUEST_TIMEOUT_MS);

        pendingRequests.set(requestId, {
          resolve,
          reject,
          timer,
          iframe,
          form
        });

        document.body.append(iframe, form);

        try {
          form.submit();
        } catch (error) {
          clearTimeout(timer);
          pendingRequests.delete(requestId);

          if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
          if (form.parentNode) form.parentNode.removeChild(form);

          reject(error);
        }
      });
    }

    function renderParticipant(participant) {
      if (!participant) {
        lookupDone = false;
        currentParticipant = null;
        $("staffInfo").replaceChildren();
        $("checkInControls").classList.add("hidden");
        showMessage("後端沒有回傳參加者資料。", "warning");
        return;
      }

      currentParticipant = participant;
      lookupDone = true;

      const container = $("staffInfo");
      container.replaceChildren();

      addField(
        container,
        "場次",
        participant.eventName || EVENT_NAME_BY_CODE[EVENT_CODE]
      );
      addField(container, "姓名", participant.name);
      addField(container, "期別學號", participant.studentId);
      addField(
        container,
        "報到狀態",
        participant.status || "尚未報到"
      );
      addField(
        container,
        "報到時間",
        participant.checkInTime || "尚未報到"
      );

      $("checkInControls").classList.remove("hidden");

      const alreadyCheckedIn = participant.status === "已報到";
      $("checkInButton").disabled = alreadyCheckedIn;

      if (alreadyCheckedIn) {
        showMessage(
          "這位參加者已經報到過了，不能重複登記。",
          "warning"
        );
      } else {
        showMessage(
          "請核對場次與參加者姓名，確認無誤後再按報到。",
          "success"
        );
      }
    }

    async function lookupStaffParticipant() {
      const pin = $("staffPin").value.trim();

      if (!validEvent() || !CURRENT_CODE) {
        showMessage(
          "報到網址缺少
